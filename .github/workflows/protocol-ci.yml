name: protocol-ci

on:
  push:
    paths:
      - "programs/**"
      - "sdk/**"
      - "hmonhook-sdk/**"
      - "options-client.mjs"
      - "launch-client.ts"
      - "launch-confirm.mjs"
      - "scripts/test-launch-confirm.mjs"
      - "scripts/test-options-client.mjs"
      - "scripts/test-options-local.mjs"
      - "scripts/test-guard-local.mjs"
      - ".github/workflows/protocol-ci.yml"
  pull_request:
    paths:
      - "programs/**"
      - "sdk/**"
      - "hmonhook-sdk/**"
      - "options-client.mjs"
      - "launch-client.ts"
      - "launch-confirm.mjs"
      - "scripts/test-launch-confirm.mjs"
      - "scripts/test-options-client.mjs"
      - "scripts/test-options-local.mjs"
      - "scripts/test-guard-local.mjs"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Jolt Guard
        run: cargo test --manifest-path programs/jolt-guard/Cargo.toml

  issuer-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check issuer options program
        run: cargo test --manifest-path programs/hmonhook-options/Cargo.toml

  hmonhook-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check h/monhook Guard program
        run: cargo test --manifest-path programs/hmonhook-guard/Cargo.toml

  hmonhook-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hmonhook-sdk/package-lock.json
      - name: Install
        working-directory: hmonhook-sdk
        run: npm ci
      - name: Build and test h/monhook SDK
        working-directory: hmonhook-sdk
        run: npm test

  issuer-options-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:options

  launch-confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:launch
      - run: npm run build:client

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        working-directory: sdk
        run: npm ci
      - name: Build and test SDK
        working-directory: sdk
        run: npm test
