name: build protocol sbf

on:
  workflow_dispatch:
  push:
    paths:
      - "programs/**"
      - ".github/workflows/sbf-build.yml"

permissions:
  contents: read

jobs:
  build-sbf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.4.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Run Jolt Guard enforcement tests
        run: cargo test --manifest-path programs/jolt-guard/Cargo.toml
      - name: Build Jolt Guard SBF
        run: |
          mkdir -p artifacts
          cargo build-sbf \
            --manifest-path programs/jolt-guard/Cargo.toml \
            --sbf-out-dir artifacts
          sha256sum artifacts/jolt_guard.so | tee artifacts/jolt_guard.so.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: jolt-guard-sbf
          path: |
            artifacts/jolt_guard.so
            artifacts/jolt_guard.so.sha256
          if-no-files-found: error

  build-hmonhook-sbf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - program: hmonhook-guard
            binary: hmonhook_guard
          - program: hmonhook-options
            binary: hmonhook_options
    steps:
      - uses: actions/checkout@v5
      - name: Install Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.4.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.program }} SBF
        run: |
          mkdir -p artifacts
          cargo build-sbf \
            --manifest-path programs/${{ matrix.program }}/Cargo.toml \
            --sbf-out-dir artifacts
          test -s artifacts/${{ matrix.binary }}.so
          sha256sum artifacts/${{ matrix.binary }}.so | tee artifacts/${{ matrix.binary }}.so.sha256
      - uses: actions/setup-node@v5
        if: matrix.program == 'hmonhook-options'
        with:
          node-version: 22
          cache: npm
      - name: Exercise issuer options on a local validator
        if: matrix.program == 'hmonhook-options'
        run: |
          cargo build-sbf --manifest-path scripts/fixtures/mock-pump/Cargo.toml --sbf-out-dir artifacts
          cargo build-sbf --manifest-path scripts/fixtures/mock-pumpswap/Cargo.toml --sbf-out-dir artifacts
          test -s artifacts/mock_pump_local_only.so
          test -s artifacts/mock_pumpswap_local_only.so
          npm ci
          npm run test:options
          PROGRAM_ID="$(solana-keygen pubkey artifacts/hmonhook_options-keypair.json)"
          solana-test-validator --reset \
            --bpf-program "$PROGRAM_ID" artifacts/hmonhook_options.so \
            --bpf-program 6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P artifacts/mock_pump_local_only.so \
            --bpf-program pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA artifacts/mock_pumpswap_local_only.so \
            > /tmp/hmonhook-validator.log 2>&1 &
          VALIDATOR_PID=$!
          trap 'kill "$VALIDATOR_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node scripts/test-options-local.mjs "$PROGRAM_ID" || { cat /tmp/hmonhook-validator.log; exit 1; }
          node scripts/test-options-buyback-local.mjs "$PROGRAM_ID" || { cat /tmp/hmonhook-validator.log; exit 1; }
          node scripts/test-options-pumpswap-local.mjs "$PROGRAM_ID" || { cat /tmp/hmonhook-validator.log; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.program }}-sbf
          path: |
            artifacts/${{ matrix.binary }}.so
            artifacts/${{ matrix.binary }}.so.sha256
          if-no-files-found: error
